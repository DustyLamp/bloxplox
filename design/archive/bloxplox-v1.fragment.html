<script>
(()=>{
const root=document.getElementById('bloxplox'),main=root.querySelector('.bp-main');
const names=['Day / ribbon','Day / columns','Mobile','Describe a day','Add a block','Resolve overlap','Inside a block','Backlog','Categories','History'];
let view=0,selected=2,dayOffset=0,noticeTimer,draft=null,selectedCats=['German'],formData={name:'German conversation',start:'09:00',duration:60},backlogAuto=true;
let blocks=[{id:1,name:'Slow start',dur:30,cat:'Personal',color:'peach'},{id:2,name:'Learn German',dur:60,cat:'German',color:'purple'},{id:3,name:'Make something good',dur:150,cat:'Work',color:'blue'},{id:4,name:'Lunch & a little nothing',dur:60,cat:'Personal',color:'peach'},{id:5,name:'bloxplox ideas',dur:90,cat:'Work',color:'blue'},{id:6,name:'Life admin',dur:30,cat:'Personal',color:'peach'},{id:7,name:'Walk + German podcast',dur:60,cat:'Movement · German',color:'multi',tasks:['A loop around the lake','Listen to Easy German']},{id:8,name:'Cook something new',dur:60,cat:'Personal',color:'peach'},{id:9,name:'Call home',dur:30,cat:'Personal',color:'peach'},{id:10,name:'Read & wind down',dur:90,cat:'Rest',color:'yellow'}];
let backlog=[{name:'Finish German chapter 4',dur:45,cat:'German',color:'purple',date:''},{name:'Sketch the kitchen shelves',dur:60,cat:'Personal',color:'peach',date:''},{name:'Book a weekend away',dur:30,cat:'Personal',color:'peach',date:'2026-10-17'},{name:'Try a longer lakeside run',dur:90,cat:'Movement',color:'green',date:'2026-10-18'}];
let categories=[{name:'German',color:'purple',hex:'#e2d8f3',count:28},{name:'Work',color:'blue',hex:'#d5e5ed',count:42},{name:'Movement',color:'green',hex:'#d6e8b4',count:19},{name:'Personal',color:'peach',hex:'#f3d8bc',count:31},{name:'Rest',color:'yellow',hex:'#f2e7ad',count:16}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const fmt=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const duration=m=>m>=60?`${Math.floor(m/60)}h${m%60?' '+m%60+'m':''}`:`${m}m`;
const total=()=>blocks.reduce((s,b)=>s+b.dur,0);
const timed=()=>{let t=480;return blocks.map(b=>{const a={...b,start:t};t+=b.dur;return a})};
const notify=t=>{const e=root.querySelector('.bp-notice');e.textContent=t;e.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>e.hidden=true,4000)};
const button=(text,action,primary=false)=>`<button class="bp-button ${primary?'bp-primary':''}" ${action}>${text}</button>`;
const close=()=>`<button class="bp-button bp-round" data-view="0" aria-label="Close">${icon('x')}</button>`;
const top=(title,sub='',actions='')=>`<div class="bp-top"><div><div class="bp-eyebrow">${view<3?'Sunday, 11 October 2026':'A little room for everything'}</div><h1>${title}</h1>${sub?`<p class="bp-sub">${sub}</p>`:''}</div><div class="bp-actions">${actions}</div></div>`;
function shell(){root.querySelector('.bp-screens').innerHTML=names.map((n,i)=>`<button class="bp-screen" data-view="${i}" aria-pressed="${i===view}"><span>${String(i+1).padStart(2,'0')}</span>${n}</button>`).join('');root.querySelector('.bp-sidebar').innerHTML=[['Today','layout-grid',0],['Backlog','list-ordered',7],['Categories','shapes',8],['History','chart-no-axes-column',9]].map(([n,i,v])=>`<button data-view="${v}" class="${(v===0?view<7:view===v)?'bp-current':''}">${icon(i)}${n}</button>`).join('')}
function blockHTML(b,start,len,vertical=false){const compact=len<=30;return `<div class="bp-block bp-${b.color} ${!vertical&&compact?'bp-compact':''} ${!vertical&&len<30?'bp-tiny':''}" data-block="${b.id}" style="${vertical?`height:${len*1.3}px;min-height:52px`:`grid-column:span ${len/15}`}" aria-label="${esc(b.name)}, ${fmt(start)}, ${duration(len)}"><button class="bp-blockface" data-open="${b.id}"><span class="bp-blocktime">${fmt(start)}${len>=60?' — '+fmt(start+len):''}</span><span class="bp-blockname">${esc(b.name)}</span><span class="bp-blockcats">${esc(b.cat)} · ${duration(len)}</span></button><button class="bp-grip" data-drag="${b.id}" aria-label="Drag ${esc(b.name)} to reorder">⠿</button><button class="bp-resize" data-resize="${b.id}" data-axis="${vertical?'y':'x'}" aria-label="Resize ${esc(b.name)}; arrow keys change by fifteen minutes">${vertical?'━':'Ⅱ'}</button></div>`}
function ribbon(){const items=timed(),end=Math.max(1200,480+total());let html='';for(let start=480;start<end;start+=240){let row='';for(const b of items){const s=Math.max(start,b.start),e=Math.min(start+240,b.start+b.dur);if(e>s)row+=blockHTML(b,s,e-s)}const freeStart=Math.max(start,480+total());if(freeStart<start+240)row+=`<div class="bp-block bp-free" style="grid-column:span ${(start+240-freeStart)/15}"><button class="bp-blockface" data-view="4"><span class="bp-blocktime">${fmt(freeStart)}</span><span class="bp-blockname">Room to breathe</span><span class="bp-blockcats">+ leave it open, or add a block</span></button></div>`;html+=`<section><div class="bp-timeaxis"><span>${fmt(start)}</span><span>${fmt(start+60)}</span><span>${fmt(start+120)}</span><span>${fmt(start+180)}</span><span>${fmt(start+240)}</span></div><div class="bp-band">${row}</div></section>`}return `<div class="bp-grid">${html}</div>`}
function day(){let title=dayOffset===0?'A day, your way.':dayOffset===1?'A little room for tomorrow.':'Your day, a little further out.';main.innerHTML=top(title,dayOffset?`${dayOffset===1?'Monday, 12 October':'Upcoming day'} · ${backlog.filter(b=>!b.date).length} things waiting in the backlog`:'Time has a shape. Make it yours.',`${button(icon('chevron-left'),'data-day="-1"')}${button(dayOffset?'Today':'Sun 11','data-day="0"')}${button(icon('chevron-right'),'data-day="1"')}`)+(dayOffset?`<div class="bp-sheet"><h2>Start with what matters.</h2><p class="bp-sub">Your next-day backlog is ready to place.</p>${backlog.filter(b=>!b.date).map(b=>`<div class="bp-draftrow bp-${b.color}"><span>${esc(b.name)}</span><span>${duration(b.dur)}</span></div>`).join('')}${button('Back to today','data-day="0"',true)}</div>`:ribbon())+`<div class="bp-viewnote"><span>Read left → right, then down. Equal area = equal time.</span><span>⠿ move &nbsp; Ⅱ resize · 15 min steps</span></div><div class="bp-addbar">${button(icon('sparkles')+' Describe my day','data-view="3"')}&nbsp;${button(icon('plus')+' Add a block','data-view="4" class="bp-fab"',true)}</div>`}
function columns(){const items=timed();main.innerHTML=top('The same day. A different shape.','Height is time. Drag the bottom edge to make room.')+`<div class="bp-columns">${[480,720,960].map((start,i)=>`<section class="bp-lane"><div class="bp-eyebrow">${['Morning','Afternoon','Evening'][i]} · ${fmt(start)}</div>${items.filter(b=>b.start<start+240&&b.start+b.dur>start).map(b=>{const s=Math.max(start,b.start),len=Math.min(start+240,b.start+b.dur)-s;return `<div class="bp-vblock"><span class="bp-vtime">${fmt(s)}</span>${blockHTML(b,s,len,true)}</div>`}).join('')}</section>`).join('')}</div><div class="bp-addbar">${button(icon('plus')+' Add a block','data-view="4"',true)}</div>`}
function mobile(){main.innerHTML=`<div class="bp-mobilecanvas"><div class="bp-phone"><div class="bp-phonetime"><span>9:41</span><span>••• ▰</span></div><div class="bp-top"><div><div class="bp-eyebrow">Sunday, 11 October</div><h1>Your kind of day.</h1></div><button class="bp-button bp-round" data-view="3" aria-label="Describe your day">${icon('sparkles')}</button></div>${timed().slice(0,4).map(b=>`<div class="bp-vblock"><span class="bp-vtime">${fmt(b.start)}</span>${blockHTML(b,b.start,b.dur,true)}</div>`).join('')}<div class="bp-addbar">${button(icon('plus')+' Add a block','data-view="4"',true)}</div><nav class="bp-bottomnav" aria-label="Mobile navigation">${[['Day','layout-grid',2],['Backlog','list-ordered',7],['History','chart-no-axes-column',9],['More','menu',8]].map(([n,i,v])=>`<button data-view="${v}">${icon(i)}${n}</button>`).join('')}</nav></div></div>`}
function describe(){main.innerHTML=`<div class="bp-sheet"><div class="bp-sheethead"><div><div class="bp-eyebrow">Make a little plan</div><h2>What does today look like?</h2></div>${close()}</div><label class="bp-field">Describe your day<textarea id="bp-story">German at 8:30 for an hour, then 2½ hours of focused work. Lunch at noon. A walk at 3, with my German podcast.</textarea></label><p class="bp-sub">Type it as you’d say it. Review the blocks before adding.</p><div class="bp-separator"></div><div id="bp-storyresult" hidden><div class="bp-eyebrow">Example interpretation · Sunday 11</div><div class="bp-draftrow bp-purple"><span>08:30 · German</span><span>1h</span></div><div class="bp-draftrow bp-blue"><span>09:30 · Focused work</span><span>2h 30m</span></div><div class="bp-draftrow bp-peach"><span>12:00 · Lunch</span><span>1h</span></div><div class="bp-draftrow bp-multi"><span>15:00 · Walk + German podcast</span><span>1h</span></div><p class="bp-sub">Lunch duration assumed: 1 hour.</p><div class="bp-separator"></div></div>${button(icon('sparkles')+' Preview example blocks','data-story class="bp-full"',true)}<p class="bp-sub">Concept preview · language interpretation is illustrated here.</p></div>`}
function add(){main.innerHTML=`<form class="bp-sheet" id="bp-addform"><div class="bp-sheethead"><div><div class="bp-eyebrow">Sunday, 11 October</div><h2>A little block of time.</h2></div>${close()}</div><label class="bp-field">What are you doing?<input name="name" value="${esc(formData.name)}" required placeholder="Give it a name"></label><div class="bp-fields"><label class="bp-field">Starts at<input name="start" type="time" value="${formData.start}" required step="900"></label><label class="bp-field">Duration<select name="duration">${[15,30,45,60,90,120,150,180].map(m=>`<option value="${m}" ${m===formData.duration?'selected':''}>${duration(m)}</option>`).join('')}</select></label></div><label class="bp-field">Categories</label><div class="bp-chips">${categories.map(c=>`<button type="button" class="bp-chip bp-${c.color}" data-cat="${esc(c.name)}" aria-pressed="${selectedCats.includes(c.name)}">${esc(c.name)}</button>`).join('')}<button type="button" class="bp-chip" data-newcat>+ New category</button></div><div class="bp-preview bp-${categories.find(c=>c.name===selectedCats[0])?.color||'green'}"><span>${esc(formData.name||'Your new block')}</span><span>${duration(formData.duration)}</span></div><div id="bp-add-error" class="bp-error" role="alert" hidden></div><button class="bp-button bp-primary bp-full" type="submit">Add to my day ${icon('arrow-right')}</button></form>`}
function overlap(){if(!draft)draft={name:'German conversation',start:540,dur:60,cat:'German',color:'purple'};const collisions=timed().filter(b=>b.start<draft.start+draft.dur&&b.start+b.dur>draft.start);main.innerHTML=`<div class="bp-sheet"><div class="bp-sheethead"><div><div class="bp-eyebrow">A small time tangle</div><h2>These share some time.</h2><p class="bp-sub">${fmt(draft.start)}–${fmt(draft.start+draft.dur)} overlaps ${collisions.length} existing block${collisions.length===1?'':'s'}.</p></div>${close()}</div><div class="bp-pair"><div class="bp-${draft.color}"><small>YOU’RE ADDING · ${duration(draft.dur)}</small><strong>${esc(draft.name)}</strong></div><div class="bp-blue"><small>ALREADY HERE</small><strong>${collisions.map(b=>esc(b.name)).join(' + ')||'Your existing plans'}</strong></div></div>${option('arrow-right','Push the day back','Start this here; shift the remaining work later.','data-resolve="push"')}${option('scan-line','Find the next free space','Place the whole block after the current plan.','data-resolve="free"')}${option('combine','Do them together','Merge the overlapping blocks into one shared block.','data-resolve="merge"')}${option('pencil','Change this block','Adjust its start time or duration.','data-view="4"')}${option('list-plus','Save it for later','Put this in your ordered backlog.','data-resolve="backlog"')}</div>`}
function option(i,n,s,a){return `<button class="bp-option" ${a}><span class="bp-optionicon">${icon(i)}</span><span><strong>${n}</strong><small>${s}</small></span><span class="bp-choice-end">${icon('chevron-right')}</span></button>`}
function detail(){const b=timed().find(b=>b.id===selected)||timed()[0];if(!b){view=4;add();return}selected=b.id;main.innerHTML=`<div class="bp-sheet"><div class="bp-sheethead"><div><div class="bp-eyebrow">Sunday · ${fmt(b.start)}–${fmt(b.start+b.dur)}</div><h2>${esc(b.name)}</h2></div>${close()}</div><div class="bp-chips"><span class="bp-chip bp-${b.color}">${esc(b.cat)}</span>${button('Edit categories','data-editcats')}</div><div class="bp-eyebrow">Time for this</div><div class="bp-duration">${button('−','data-duration="-15" aria-label="Shorten by fifteen minutes"')}<output>${duration(b.dur)}</output>${button('+','data-duration="15" aria-label="Extend by fifteen minutes"')}</div><p class="bp-sub">Changing duration moves the following blocks.</p><div class="bp-separator"></div>${(b.tasks||[b.name]).map((n,i)=>`<label class="bp-checkrow"><input type="checkbox" data-task="${i}" ${b.done?.includes(i)?'checked':''}><span>${esc(n)}</span></label>`).join('')}${option('plus','Add another thing','Two things, one block of time.','data-addtask')}${option('sunrise','Move to tomorrow','Keep its duration and categories.','data-move="tomorrow"')}${option('list-plus','Add to backlog','Let it find its time later.','data-move="backlog"')}<div class="bp-separator"></div><div class="bp-actions">${button(icon('arrow-up')+' Earlier','data-reorder="-1"')}${button(icon('arrow-down')+' Later','data-reorder="1"')}${button('Done','data-view="0"',true)}</div></div>`}
function backlogView(){main.innerHTML=top('Not now. Not forgotten.','In order, ready when you are.',button(icon('plus')+' Add a thought','data-backadd',true))+`<label class="bp-rule"><span><strong>Bring undated things into tomorrow</strong><br>In this order, from 08:00. Dated items wait for their day.</span><input type="checkbox" data-auto ${backlogAuto?'checked':''}></label><div class="bp-list">${backlog.map((b,i)=>`<div class="bp-listrow" data-backrow="${i}"><div class="bp-rank"><span>${String(i+1).padStart(2,'0')}</span><button data-backup="${i}" aria-label="Move ${esc(b.name)} up" ${i===0?'disabled':''}>↑</button><button data-backdown="${i}" aria-label="Move ${esc(b.name)} down" ${i===backlog.length-1?'disabled':''}>↓</button></div><span class="bp-dot bp-${b.color}"></span><div class="bp-listname"><strong>${esc(b.name)}</strong><small>${esc(b.cat)} · ${duration(b.dur)}</small></div><button class="bp-pill" data-backdate="${i}">${b.date?new Date(b.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):backlogAuto?'Tomorrow, automatically':'No date'}</button>${button('+ Today',`data-backtoday="${i}"`)}</div>`).join('')}</div><p class="bp-sub" style="margin-top:22px">Set a date to keep something off your plate until then.</p>`}
function categoryView(){main.innerHTML=top('Give your time a colour.','Categories connect your day to the bigger picture.',button(icon('plus')+' New category','data-newcat',true))+`<div class="bp-categorygrid">${categories.map((c,i)=>`<div class="bp-category bp-${c.color}"><div><h3>${esc(c.name)}</h3><small>${c.count} completed blocks · tracked in history</small></div><label aria-label="Choose ${esc(c.name)} colour"><input type="color" value="${c.hex}" data-color="${i}" aria-label="Choose ${esc(c.name)} colour"></label></div>`).join('')}</div><div class="bp-rule"><span>One block can have several categories.<br>Shared blocks show both colours.</span><span class="bp-chip bp-multi">Movement + German</span></div>`}
function history(cat='German',period='3'){const sample={German:[8.5,10,12.5],Work:[72,80,68],Movement:[12,15,18],Personal:[22,24,21],Rest:[16,20,24]},values=sample[cat]||[0,0,0],months=['July','August','September'];const shown=period==='1'?values.slice(-1):values;const labels=period==='1'?months.slice(-1):months;const sum=shown.reduce((a,b)=>a+b,0);main.innerHTML=top('It all adds up.','Completed time, collected a little at a time.')+`<div class="bp-fields"><label class="bp-field">Category<select data-historycat>${categories.map(c=>`<option ${c.name===cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="bp-field">Period<select data-historyperiod><option value="3" ${period==='3'?'selected':''}>Last 3 complete months</option><option value="1" ${period==='1'?'selected':''}>Last complete month</option></select></label></div><div class="bp-stat">${sum}<span style="font-size:23px;letter-spacing:-.4px"> hours</span></div><p class="bp-sub">of ${esc(cat.toLowerCase())} · ${period==='1'?'September':'July–September'} 2026</p><div class="bp-chart" role="img" aria-label="${esc(cat)} completed hours: ${labels.map((m,i)=>m+' '+shown[i]).join(', ')}">${shown.map(v=>`<div class="bp-month"><span>${v}h</span><div class="bp-bar bp-${categories.find(c=>c.name===cat)?.color||'purple'}" style="height:${Math.max(4,v/Math.max(...shown,1)*170)}px;background:var(--bp-${categories.find(c=>c.name===cat)?.color||'purple'})"></div></div>`).join('')}</div><div class="bp-month-labels">${labels.map(m=>`<span>${m}</span>`).join('')}</div><div class="bp-eyebrow">Recent completed blocks · example</div>${cat==='German'?`<div class="bp-listrow"><div class="bp-listname"><strong>German café conversation</strong><small>29 September · German</small></div><span>1h</span></div><div class="bp-listrow"><div class="bp-listname"><strong>Walk + German podcast</strong><small>27 September · Movement + German</small></div><span>45m</span></div>`:`<div class="bp-listrow"><div class="bp-listname"><strong>${esc(cat)} time</strong><small>30 September · ${esc(cat)}</small></div><span>1h</span></div>`}<p class="bp-sub" style="margin-top:20px">Only completed time counts. Shared time counts once per category; day totals count it once.</p>`}
function render(){shell();[day,columns,mobile,describe,add,overlap,detail,backlogView,categoryView,history][view]();root.querySelectorAll('button:not([type])').forEach(b=>b.type='button');if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
function newCategory(){const prior=view;main.innerHTML=`<form class="bp-sheet" id="bp-categoryform"><div class="bp-sheethead"><h2>A new colour of your day.</h2><button class="bp-button bp-round" data-view="${prior}" aria-label="Close">×</button></div><label class="bp-field">Category name<input name="category" required placeholder="e.g. Music"></label><label class="bp-field">Colour<select name="color"><option value="purple">Lavender</option><option value="green">Sage</option><option value="peach">Apricot</option><option value="blue">Sky</option><option value="yellow">Butter</option></select></label><button class="bp-button bp-primary" type="submit">Create category</button></form>`;main.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('category')).trim();if(!name)return;if(categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return notify('That category already exists.');const color=String(f.get('color'));categories.push({name,color,hex:({purple:'#e2d8f3',green:'#d6e8b4',peach:'#f3d8bc',blue:'#d5e5ed',yellow:'#f2e7ad'})[color],count:0});selectedCats.push(name);view=prior;render();notify(`${name} is ready to use.`)}}
function adjust(id,delta){const b=blocks.find(b=>b.id===id);if(!b)return;b.dur=Math.max(15,Math.min(240,b.dur+delta));render();notify(`${b.name}: ${duration(b.dur)}. Following blocks moved.`)}
function rememberForm(){const f=main.querySelector('#bp-addform');if(f){const d=new FormData(f);formData={name:String(d.get('name')),start:String(d.get('start')),duration:Number(d.get('duration'))}}}
function insertAt(d){let list=timed(),index=list.findIndex(b=>b.start+b.dur>d.start);if(index<0){const gap=d.start-(480+total());if(gap>0)blocks.push({id:Date.now()-1,name:'Open time',dur:gap,cat:'Unplanned',color:'free'});blocks.push({...d,id:Date.now()})}else{const b=list[index];if(d.start>b.start){const before=d.start-b.start,remaining=b.dur-before;blocks[index].dur=before;blocks.splice(index+1,0,{...d,id:Date.now()},{...blocks[index],id:Date.now()+1,name:b.name+' · continued',dur:remaining})}else blocks.splice(index,0,{...d,id:Date.now()})}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;

if(b.dataset.reorder){const i=blocks.findIndex(x=>x.id===selected),j=i+Number(b.dataset.reorder);if(j>=0&&j<blocks.length)[blocks[i],blocks[j]]=[blocks[j],blocks[i]];render();return}
if(b.hasAttribute('data-addtask')){main.innerHTML=`<form class="bp-sheet" id="bp-taskform"><h2>One block, another thing.</h2><label class="bp-field" style="margin-top:20px">What else?<input name="task" required placeholder="e.g. Listen to a German podcast"></label><div class="bp-actions"><button class="bp-button bp-primary">Add to block</button><button type="button" class="bp-button" data-view="6">Cancel</button></div></form>`;main.querySelector('form').onsubmit=e=>{e.preventDefault();const text=new FormData(e.target).get('task').trim();if(!text)return;const item=blocks.find(x=>x.id===selected);item.tasks=[...(item.tasks||[item.name]),text];item.name=item.tasks.join(' + ');render()};return}
if(b.hasAttribute('data-editcats')){const item=blocks.find(x=>x.id===selected);main.innerHTML=`<form class="bp-sheet" id="bp-editcategories"><h2>Categories for this block</h2>${categories.map(c=>`<label class="bp-checkrow"><input type="checkbox" name="category" value="${esc(c.name)}" ${item.cat.split(' · ').includes(c.name)?'checked':''}>${esc(c.name)}</label>`).join('')}<button class="bp-button bp-primary" style="margin-top:20px">Save categories</button></form>`;main.querySelector('form').onsubmit=e=>{e.preventDefault();const cs=new FormData(e.target).getAll('category');item.cat=cs.join(' · ')||'Uncategorised';item.color=cs.length>1?'multi':categories.find(c=>c.name===cs[0])?.color||'free';render()};return}
if(b.dataset.resolve){const mode=b.dataset.resolve;if(mode==='backlog')backlog.unshift({...draft,date:''});else if(mode==='free')blocks.push({...draft,id:Date.now()});else if(mode==='push')insertAt(draft);else{const ts=timed(),hits=ts.filter(x=>x.start<draft.start+draft.dur&&x.start+x.dur>draft.start);if(hits.length){const first=blocks.findIndex(x=>x.id===hits[0].id),last=blocks.findIndex(x=>x.id===hits.at(-1).id),start=Math.min(draft.start,hits[0].start),end=Math.max(draft.start+draft.dur,hits.at(-1).start+hits.at(-1).dur);const cats=[...new Set([...hits.flatMap(x=>x.cat.split(' · ')),...draft.cat.split(' · ')])];blocks.splice(first,last-first+1,{id:Date.now(),name:[...hits.map(x=>x.name),draft.name].join(' + '),tasks:[...hits.map(x=>x.name),draft.name],dur:end-start,cat:cats.join(' · '),color:cats.length>1?'multi':draft.color})}else insertAt(draft)}draft=null;view=mode==='backlog'?7:0;render();notify(({backlog:'Saved to your backlog.',free:'Placed in the next open space.',push:'Added. The remaining blocks shifted later.',merge:'Combined into one block with multiple activities.'})[mode]);return}
if(b.hasAttribute('data-backup')||b.hasAttribute('data-backdown')){const i=Number(b.dataset.backup??b.dataset.backdown),j=i+(b.hasAttribute('data-backup')?-1:1);if(j>=0&&j<backlog.length)[backlog[i],backlog[j]]=[backlog[j],backlog[i]];render();return}
if(b.hasAttribute('data-backtoday')){const item=backlog.splice(Number(b.dataset.backtoday),1)[0];blocks.push({...item,id:Date.now()});render();notify(`Added at ${fmt(480+total()-item.dur)} today.`);return}

if(b.hasAttribute('data-backadd')){main.innerHTML=`<form class="bp-sheet" id="bp-backform"><h2>Get it out of your head.</h2><label class="bp-field" style="margin-top:20px">A thing for later<input name="name" required></label><label class="bp-field">Duration<select name="duration"><option value="30">30m</option><option value="60">1h</option><option value="90">1h 30m</option></select></label><button class="bp-button bp-primary">Add to backlog</button></form>`;main.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name)return;backlog.push({name,dur:Number(f.get('duration')),date:'',cat:'Personal',color:'peach'});render()};return}
});
root.addEventListener('submit',e=>{if(e.target.id!=='bp-addform')return;e.preventDefault();rememberForm();const [h,m]=formData.start.split(':').map(Number),start=h*60+m;const error=root.querySelector('#bp-add-error');if(start<480||start+formData.duration>1440||start%15){error.hidden=false;error.textContent='For this day preview, choose 08:00–23:45 in 15-minute steps, ending by midnight.';return}if(!formData.name.trim()){error.hidden=false;error.textContent='Give this block a name.';return}draft={name:formData.name.trim(),start,dur:formData.duration,cat:selectedCats.join(' · ')||'Uncategorised',color:selectedCats.length>1?'multi':categories.find(c=>c.name===selectedCats[0])?.color||'green'};if(timed().some(b=>b.start<start+draft.dur&&b.start+b.dur>start)){view=5;render()}else{insertAt(draft);draft=null;view=0;render();notify('Your new block is in the day.')}});
root.addEventListener('change',e=>{if(e.target.matches('[data-auto]')){backlogAuto=e.target.checked;render()}if(e.target.matches('[data-task]')){const b=blocks.find(x=>x.id===selected),i=Number(e.target.dataset.task);b.done=e.target.checked?[...new Set([...(b.done||[]),i])]:(b.done||[]).filter(x=>x!==i);notify(e.target.checked?'Marked complete.':'Marked incomplete.')}if(e.target.matches('[data-historycat],[data-historyperiod]'))history(main.querySelector('[data-historycat]').value,main.querySelector('[data-historyperiod]').value);if(e.target.matches('[data-color]')){const c=categories[Number(e.target.dataset.color)];c.hex=e.target.value;root.style.setProperty('--bp-'+c.color,`light-dark(${c.hex}, color-mix(in srgb, ${c.hex} 38%, #19231b))`);notify(`${c.name} colour updated.`)}});
root.addEventListener('keydown',e=>{const b=e.target.closest('[data-resize]');if(!b)return;if(['ArrowLeft','ArrowDown','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();adjust(Number(b.dataset.resize),['ArrowLeft','ArrowDown'].includes(e.key)?-15:15)}});
let gesture=null;
root.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-resize],[data-drag]');if(!h)return;e.preventDefault();const id=Number(h.dataset.resize||h.dataset.drag),item=blocks.find(b=>b.id===id);if(!item)return;const band=h.closest('.bp-band');gesture={id,kind:h.hasAttribute('data-resize')?'resize':'drag',axis:h.dataset.axis||'x',x:e.clientX,y:e.clientY,dur:item.dur,scale:band?band.getBoundingClientRect().width/240:1.3,target:null};h.setPointerCapture(e.pointerId)});
root.addEventListener('pointermove',e=>{if(!gesture)return;if(gesture.kind==='drag'){const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-block]');root.querySelectorAll('.bp-drop').forEach(n=>n.classList.remove('bp-drop'));if(hit){gesture.target=Number(hit.dataset.block);hit.classList.add('bp-drop')}}else{const delta=gesture.axis==='y'?e.clientY-gesture.y:e.clientX-gesture.x;gesture.next=Math.max(15,Math.min(240,gesture.dur+Math.round(delta/gesture.scale/15)*15));const h=root.querySelector(`[data-resize="${gesture.id}"]`);if(h)h.setAttribute('aria-label',`Resize to ${duration(gesture.next)}`);const block=root.querySelector(`[data-block="${gesture.id}"] .bp-blockcats`);if(block)block.textContent=`Release for ${duration(gesture.next)}`}});
root.addEventListener('pointerup',()=>{if(!gesture)return;const g=gesture;gesture=null;if(g.kind==='resize'&&g.next!==undefined)adjust(g.id,g.next-g.dur);else if(g.kind==='drag'&&g.target&&g.target!==g.id){const i=blocks.findIndex(b=>b.id===g.id),j=blocks.findIndex(b=>b.id===g.target);const [b]=blocks.splice(i,1);blocks.splice(j,0,b);render();notify(`${b.name} moved. The day has rearranged.`)}else root.querySelectorAll('.bp-drop').forEach(n=>n.classList.remove('bp-drop'))});root.addEventListener('pointercancel',()=>{gesture=null;render()});
render();
if(globalThis.Tweak){const look={radius:16,gap:7};const t=new Tweak({container:root.querySelector('.bp-product'),onChange:()=>{root.style.setProperty('--bp-radius',look.radius+'px');root.style.setProperty('--bp-gap',look.gap+'px')}});t.addSlider(look,'radius',{label:'Block corners',min:2,max:26,unit:'px'});t.addSlider(look,'gap',{label:'Space between blocks',min:2,max:14,unit:'px'})}
})();
</script>
