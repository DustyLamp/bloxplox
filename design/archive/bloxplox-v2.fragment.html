<div id="bloxplox-v2" aria-label="Bloxplox revised mockups">
  <div class="bp2-review"><label>Mockup <select id="bp2-scenes" aria-label="Choose mockup"></select></label><span>Sample data</span></div>
<svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
  <defs>
    <filter id="bp2-check-deboss" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="0" dy="0.95" result="lower"/>
      <feComposite in="SourceAlpha" in2="lower" operator="out" result="upper-edge"/>
      <feGaussianBlur in="upper-edge" stdDeviation="0.3" result="soft-upper"/>
      <feFlood flood-color="#19241f" flood-opacity="0.86" result="shade"/>
      <feComposite in="shade" in2="soft-upper" operator="in" result="inner-shade"/>
      <feOffset in="SourceAlpha" dx="0" dy="-0.55" result="upper"/>
      <feComposite in="SourceAlpha" in2="upper" operator="out" result="lower-edge"/>
      <feGaussianBlur in="lower-edge" stdDeviation="0.2" result="soft-lower"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.45" result="light"/>
      <feComposite in="light" in2="soft-lower" operator="in" result="inner-light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="inner-shade"/><feMergeNode in="inner-light"/></feMerge>
    </filter>
  </defs>
</svg>
  <div class="bp2-app" aria-label="Bloxplox">
    <header class="bp2-header"></header>
    <main class="bp2-main"></main>
    <div class="bp2-overlay" hidden></div>
    <div class="bp2-toast" role="status" aria-live="polite" hidden></div>
  </div>
</div>

const schedules=[];
const generatedOccurrences=new Set();

const dayNumber=d=>Math.round(Date.parse(d+'T12:00:00Z')/86400000);
const weekDay=d=>(new Date(d+'T12:00:00Z').getUTCDay()+6)%7;

function blockStatus(b,d=date){return b.habitId?habitResult(b.habitId,d).status:(b.status||(b.done?'done':'none'))}

function matchesSchedule(r,d){if(d<r.startDate||(r.endDate&&d>r.endDate))return false;const n=dayNumber(d)-dayNumber(r.startDate);if(r.repeat==='once')return n===0;if(r.repeat==='daily')return true;if(r.repeat==='weekly')return r.week.includes(weekDay(d));if(r.repeat==='interval')return n%r.interval===0;const x=new Date(d+'T12:00:00Z'),last=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)).getUTCDate();return x.getUTCDate()===Math.min(r.monthDay,last)}
function scheduleLabel(r){if(!r)return '';const time=fmt(r.start);if(r.repeat==='once')return `${dateLabel(r.startDate)} · ${time}`;if(r.repeat==='daily')return `Daily · ${time}`;if(r.repeat==='weekly')return `${[...r.week].sort().map(i=>weekNames[i].slice(0,3)).join(', ')} · ${time}`;if(r.repeat==='interval')return `Every ${r.interval} days · ${time}`;return `Monthly on ${r.monthDay} · ${time}`}
function plannedInsert(items,b,policy){const out=items.map(x=>({...x})).sort((a,z)=>a.start-z.start);if(policy==='free'){b={...b,start:nextSpace(out,b.start,b.dur)};return b.start+b.dur<=1440?[...out,b].sort((a,z)=>a.start-z.start):null}let end=b.start+b.dur;for(const x of out){if(x.start+x.dur<=b.start)continue;x.start=Math.max(end,x.start);end=x.start+x.dur}if(end>1440)return null;return [...out,b].sort((a,z)=>a.start-z.start)}

 const results=new Map();

function historyButton(kind,d){const s=completionStats(kind,d),x=new Date(d+'T12:00:00Z'),percent=s.total?s.done/s.total*100:0;return `<button type="button" class="rt-day" data-date="${d}" aria-pressed="${d===date}" aria-label="${dateLabel(d)}, ${s.done} of ${s.total} completed" style="--rt-progress:${percent}%;--rt-date-ink:${percent>=39?'#173e2e':'#fafaff'};--rt-week-ink:${percent>=89?'#173e2e':'#fafaff'}"><span class="rt-dayweek">${weekNames[weekDay(d)].slice(0,3)}</span><span>${x.getUTCDate()} ${x.toLocaleDateString('en-GB',{month:'short',timeZone:'UTC'})}</span></button>`}

function mountHistory(){const nav=main.querySelector('.rt-history');if(!nav)return;const kind=nav.parentElement.dataset.historyKind;const step=()=>nav.firstElementChild.getBoundingClientRect().width+(parseFloat(getComputedStyle(nav).columnGap)||0);let extending=false;nav.scrollLeft=45*step()-(nav.clientWidth-step())/2;nav.addEventListener('scroll',()=>{if(extending)return;const width=step(),i=Math.max(0,Math.min(nav.children.length-1,Math.floor((nav.scrollLeft+nav.clientWidth/2)/width)));historyFocus=nav.children[i].dataset.date;if(nav.scrollLeft<width*8){extending=true;const first=nav.firstElementChild.dataset.date;nav.insertAdjacentHTML('afterbegin',Array.from({length:30},(_,j)=>historyButton(kind,shiftDate(first,j-30))).join(''));nav.scrollLeft+=30*width;if(historyDragging?.el===nav)historyDragging.scroll+=30*width;while(nav.children.length>151)nav.lastElementChild.remove();extending=false}else if(nav.scrollWidth-nav.clientWidth-nav.scrollLeft<width*8){extending=true;const last=nav.lastElementChild.dataset.date;nav.insertAdjacentHTML('beforeend',Array.from({length:30},(_,j)=>historyButton(kind,shiftDate(last,j+1))).join(''));let removed=0;while(nav.children.length>151){nav.firstElementChild.remove();removed++}nav.scrollLeft-=removed*width;if(historyDragging?.el===nav)historyDragging.scroll-=removed*width;extending=false}},{passive:true});nav.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();nav.scrollLeft+=e.deltaY}},{passive:false});nav.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')historyDragging={el:nav,x:e.clientX,scroll:nav.scrollLeft,active:false,pointer:e.pointerId}})}

function habitSchedule(){const d=scheduleDraft,h=habitById(d.habitId);const repeats=[['once','Once'],['daily','Every day'],['weekly','Weekly'],['interval','Every N days'],['monthly','Monthly']];let repeatFields='';if(d.repeat==='weekly')repeatFields=field('Times per week',`<input id="bp2-schedule-count" type="number" min="1" max="7" value="${d.count}">`)+`<div class="bp2-repeatdays" aria-label="Scheduled weekdays">${weekNames.map((n,i)=>`<button type="button" data-scheduleday="${i}" aria-label="${n}" aria-pressed="${d.week.includes(i)}">${n.slice(0,1)}</button>`).join('')}</div>`;if(d.repeat==='interval')repeatFields=field('Every N days',`<input id="bp2-schedule-interval" type="number" min="1" max="365" value="${d.interval}">`);if(d.repeat==='monthly')repeatFields=field('Day of month',`<input id="bp2-schedule-monthday" type="number" min="1" max="31" value="${d.monthDay}">`)+`<p class="bp2-monthnote">Shorter months use the last day.</p>`;showDialog('Schedule '+h.name,`<div class="bp2-fields">${field(d.repeat==='once'?'Date':'Starts',`<input type="date" id="bp2-schedule-start" value="${d.startDate}">`)}${field('Repeat',`<select id="bp2-schedule-repeat">${repeats.map(([v,n])=>`<option value="${v}" ${d.repeat===v?'selected':''}>${n}</option>`).join('')}</select>`)}</div><div class="bp2-fields">${field('Start time',`<input type="time" id="bp2-schedule-time" step="900" value="${fmt(d.start)}">`)}${field('Duration',`<select id="bp2-schedule-duration">${[15,30,45,60,90,120,150,180,240].map(n=>`<option value="${n}" ${d.dur===n?'selected':''}>${dur(n)}</option>`).join('')}</select>`)}</div>${repeatFields}<div class="bp2-fields">${field('Category',`<select id="bp2-schedule-category">${categories.map(c=>`<option ${c.name===d.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`)}${field('If occupied',`<select id="bp2-schedule-conflict"><option value="push" ${d.conflict==='push'?'selected':''}>Push following</option><option value="free" ${d.conflict==='free'?'sel function saveHabitSchedule(){readSchedule();const d=scheduleDraft,error=root.querySelector('#bp2-schedule-error'),fail=msg=>{error.hidden=false;error.textContent=msg};if(!d.startDate||!valid(d.start,d.dur))return fail('Choose a date and a 15-minute start time from 08:00.');if(d.endDate&&d.endDate<d.startDate)return fail('End date must follow the start date.');if(d.repeat==='weekly'&&(!Number.isInteger(d.count)||d.count<1||d.count>7||d.week.length!==d.count))return fail(`Choose ${d.count} weekdays.`);if(d.repeat==='interval'&&(!Number.isInteger(d.interval)||d.interval<1||d.interval>365))return fail('Use an interval from 1 to 365 days.');if(d.repeat==='monthly'&&(!Number.isInteger(d.monthDay)||d.monthDay<1||d.monthDay>31))return fail('Use a day from 1 to 31.');const start=d.startDate<today?today:d.startDate;let first=null;for(let n=0;n<400;n++){const day=shiftDate(d.startDate,n);if(matchesSchedule(d,day)){first=day;break}}if(!first)return fail('No occurrence falls inside these dates.');for(const day of new Set([first,...Object.keys(days)])){if(!matchesSchedule(d,day))continue;const items=(days[day]||[]).filter(b=>!(d.id&&b.scheduleId===d.id&&day>=start));if(!plannedInsert(items,{start:d.start,dur:d.dur},d.conflict))return fail(`No room before midnight on ${dateLabel(day)}.`);if(items.some(b=>b.habitId===d.habitId&&b.scheduleId!==d.id))return fail(`Already linked to a block on ${dateLabel(day)}.`)}if(d.id){removeSchedule(d.id,false,start);schedules.push({...d,week:[...d.week]})}else schedules.push({...d,id:nextScheduleId++,week:[...d.week]});date=first;historyFocus=date;page='schedule';render();notify(d.repeat==='once'?'Habit scheduled':'Recurring block added')}
function removeSchedule(id,renderAfter=true,from=today){const i=schedules.findIndex(r=>r.id===id);if(i>=0)schedules.splice(i,1);for(const day of Object.keys(days))if(day>=from)days[day]=days[day].filter(b=>b.scheduleId!==id);for(const key of generatedOccurrences)if(key.startsWith(id+':')&&key.slice(key.indexOf(':')+1)>=from)generatedOccurrences.delete(key);if(renderAfter){page=scheduleReturn;render();notify('Schedule removed')}}
function linkedHabitPicker(){const b=getBlock();showDialog('Link habit',`${field('Habit',`<select id="bp2-linkedhabit"><option value="">None</option>${habits.map(h=>`<option value="${h.id}" ${b.habitId===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select>`)}${btn('Save','data-savelink','bp2-primary bp2-full')}`)}

function positionMovePreview(d,x,y){const box=main.getBoundingClientRect(),w=d.preview.offsetWidth,h=d.preview.offsetHeight;d.preview.style.left=Math.max(7,Math.min(box.width-w-7,x-box.left-w*.45))+'px';d.preview.style.top=Math.max(7,Math.min(box.height-h-7,y-box.top-h*.4))+'px'}

 if(Number(hit.dataset.block)===0){const start=Number(hit.dataset.slotStart),length=Number(hit.dataset.slotMinutes),fraction=displayMode==='list'?0:(x-box.left)/box.width;d.targetTime=start+Math.min(length-15,Math.max(0,Math.floor(fraction*length/15)*15));d.after=false;hit.style.setProperty('--bp2-drop-x',(d.targetTime-start)/length*100+'%')}

let swipeBusy=false;
const swipeUnderlay=()=>'<div class="bp2-swipe-underlay" aria-hidden="true"><span class="bp2-swipe-symbol"></span></div>';
const swipeThreshold=el=>Math.min(100,Math.max(32,el.getBoundingClientRect().width*.4));
function swipePreview(el,status,dx,ready){
 const target=swipeStatus(status,dx),icon=target==='done'?'check':target==='missed'?'x':'brush-cleaning';
 const width=el.getBoundingClientRect().width,symbol=el.querySelector('.bp2-swipe-symbol');
 el.dataset.swipe=target;el.dataset.swipeSide=dx>=0?'right':'left';el.dataset.swipeReady=String(ready);
 el.classList.add('bp2-swiping');
 el.style.setProperty('--bp2-swipe-x',Math.sign(dx)*Math.min(Math.abs(dx),width)+'px');
 el.style.setProperty('--bp2-swipe-icon',Math.min(52,Math.max(25,width*.15))+'px');

}
function resetSwipe(el){if(!el)return;el.classList.remove('bp2-swiping','bp2-swipe-settling');el.style.removeProperty('--bp2-swipe-x');delete el.dataset.swipeReady}
function settleSwipe(el,dx,commit,apply){

 el.style.setProperty('--bp2-swipe-x',(commit?Math.sign(dx)*el.getBoundingClientRect().width:0)+'px');

root.addEventListener('pointerdown',e=>{
 const el=e.target.closest('[data-resize],[data-reorder],[data-open]');if(!el||!overlay.hidden||swipeBusy||e.button!==0)return;
 const id=Number(el.dataset.resize||el.dataset.reorder||el.dataset.open),b=list().find(x=>x.id===id);if(!b)return;
 const parent=el.closest('[data-block]'),band=el.closest('.bp2-band');
 drag={id,kind:el.hasAttribute('data-resize')?'resize':'pending',x:e.clientX,y:e.clientY,time:performance.now(),dur:b.dur,scale:(band?.getBoundingClientRect().width||960)/Number(band?.dataset.period||240),active:false,target:null,pointer:e.pointerId,element:el,parent};

root.addEventListener('pointermove',e=>{
 if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(Math.hypot(dx,dy)<7&&!drag.active)return;
 if(drag.kind==='pending'){
  clearMoveTimer(drag);if(performance.now()-drag.time>=350)beginMove(drag);
  else{if(Math.abs(dy)>Math.abs(dx)){drag=null;return}drag.kind='swipe'}
 }
 drag.active=true;drag.element.setPointerCapture(e.pointerId);suppressClick=true;e.preventDefault();
 if(drag.kind==='resize'){
  drag.next=Math.max(15,Math.min(240,drag.dur+Math.round(dx/drag.scale/15)*15));const title=drag.parent.querySelector('.bp2-meta');if(title)title.textContent=dur(drag.next);drag.parent.classList.add('bp2-dragged');

  drag.delta=dx;drag.threshold=swipeThreshold(drag.parent);swipePreview(drag.parent,blockStatus(list().find(b=>b.id===drag.id)),dx,Math.abs(dx)>=drag.threshold);

  updateMove(drag,e.clientX,e.clientY);

});
root.addEventListener('pointerup',()=>{
 if(!drag)return;const d=drag;drag=null;clearMoveTimer(d);if(!d.active)return;
 if(d.kind==='swipe'){
  const b=list().find(x=>x.id===d.id),day=date,status=swipeStatus(blockStatus(b),d.delta);
  settleSwipe(d.parent,d.delta,Math.abs(d.delta)>=d.threshold,()=>{setBlockStatus(b,status,day);if(date===day){if(page==='schedule')schedule();else if(page==='tracker')tracker()}});return;
 }
 if(d.kind==='resize'&&d.next!==undefined)changeDuration(d.id,d.next-d.dur);
 else if(d.kind==='move'){cleanupMove(d);if(d.moved&&(d.target||d.targetTime!==null))placeBlock(d.id,d.target,d.after,d.targetTime);else if(d.grip&&!d.moved){selected=d.id;movePicker()}}

root.addEventListener('pointerdown',e=>{

});

 if(!g.active&&(Math.abs(dx)<10||Math.abs(dy)>Math.abs(dx)))return;

 settleSwipe(g.element,g.dx,Math.abs(g.dx)>=swipeThreshold(g.element),()=>{result.status=status;if(date===day){if(page==='tracker')tracker();else if(page==='schedule')schedule()}});

function head(){header.innerHTML=`<button type="button" class="bp2-brand" data-page="schedule">bloxplox</button><nav class="bp2-switch" aria-label="Day view"><button type="button" data-page="schedule" aria-pressed="${page==='schedule'}">Blocks</button><button type="button" data-tracker aria-pressed="${page==='tracker'}">Tracker</button></nav><div class="bp2-layoutswitch" aria-label="Layout for Blocks and Tracker"><button type="button" data-layout="grid" aria-pressed="${displayMode==='grid'}">${ico('layout-grid')}<span>Grid</span></button><button type="button" data-layout="list" aria-pressed="${displayMode==='list'}">${ico('list')}<span>List</span></button></div><div class="bp2-datebar">${iconBtn('chevron-left','Previous day','data-day="-1"')}<button type="button" class="bp2-datebutton" data-calendar>${dateLabel(date)} ${ico('chevron-down')}</button>${iconBtn('chevron-right','Next day','data-day="1"')}</div>${iconBtn('menu','Menu','data-menu','bp2-menutoggle')}${menu?`<nav class="bp2-menu" aria-label="Menu">${[['Backlog','list-ordered','backlog'],['Categories','shapes','categories'],['History','chart-no-axes-column','history']].map(([n,i,p])=>`<button type="button" data-page="${p}">${ico(i)}${n}</button>`).join('')}<button type="button" data-describe>${ico('text-cursor-input')}Describe a day</button></nav>`:''}`}
function blockHTML(b,start,len,vertical=false){const free=b.id===0;return `<div class="bp2-block ${vertical?'bp2-vertical':''} ${!vertical&&len<=45?'bp2-small':''} ${!vertical&&len<=15?'bp2-tiny':''} ${free?'bp2-free':''}" data-block="${b.id}" data-slot-start="${start}" data-slot-minutes="${len}" style="background:${fill(b.cats)};${vertical?`height:${Math.max(32,len*(layout==='mobile'||root.clientWidth<560?1.25:2.56))}px`:`grid-column:span ${len/15}`}" aria-label="${esc(b.name)}, ${fmt(start)}, ${dur(len)}"><div class="bp2-cardclip">${free?'':swipeUnderlay()}<button type="button" class="bp2-face" ${free?`data-add-at="${start}"`:`data-open="${b.id}"`}><span class="bp2-time">${fmt(start)}${b.habitId?`<span class="bp2-linkicon" aria-label="Linked habit">${ico(b.scheduleId?'repeat':'link')}</span>`:''}</span><span class="bp2-name">${esc(b.name)}</span>${free?'':`<span class="bp2-meta">${dur(b.dur)}</span>`}</button></div>${free?'':`<button type="button" class="bp2-movegrip" data-reorder="${b.id}" aria-label="Move ${esc(b.name)}" aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown" data-tooltip="Drag to move">${ico('grip-vertical')}</button><button type="button" class="bp2-edge" data-resize="${b.id}" data-axis="${vertical?'y':'x'}" aria-label="Resize ${esc(b.name)}; arrow keys adjust fifteen minutes"></button>`}</div>`}
function segments(period=240){const a=list(),out=[];let at=480;for(const b of a){if(b.start>at)out.push({id:0,name:'Available',start:at,dur:b.start-at,cats:[]});out.push(b);at=Math.max(at,b.start+b.dur)}const finish=Math.max(1200,480+Math.ceil((at-480)/period)*period);if(at<finish)out.push({id:0,name:'Available',start:at,dur:finish-at,cats:[]});return out}
function schedule(){const small=layout==='mobile'||root.clientWidth<560,period=small?120:240,seg=segments(period),end=Math.max(1200,...seg.map(b=>b.start+b.dur));let html='';if(displayMode==='list'){html=seg.map(b=>blockHTML(b,b.start,b.dur)).join('')}else for(let start=480;start<end;start+=period){let row='';for(const b of seg){const a=Math.max(start,b.start),z=Math.min(start+period,b.start+b.dur);if(z>a)row+=blockHTML(b,a,z-a)}html+=`<div class="bp2-band" data-period="${period}">${row}</div>`}main.innerHTML=`${completionHistory('blocks')}<div class="${displayMode==='list'?'bp2-list':'bp2-grid'}">${html}</div><button type="button" class="bp2-fab" data-add aria-label="Add a block">${ico('plus')}</button>`;for(const b of list()){const status=blockStatus(b);if(!['done','missed'].includes(status))continue;main.querySelectorAll(`[data-block="${b.id}"]`).forEach(n=>{n.classList.add('bp2-recorded',status==='done'?'bp2-isdone':'bp2-ismissed');n.querySelector('.bp2-face').insertAdjacentHTML('beforeend',`<span class="bp2-completionstamp" role="img" aria-label="${status==='done'?'Completed':'Not done'}">${ico(status==='done'?'check':'x')}</span>`)})}mountHistory();icons()}

function tracker(){ensureDay(date);const due=dueHabits(),done=due.filter(h=>habitResult(h.id).status==='done').length;main.innerHTML=`<section class="rt-surface" aria-label="Daily habit tracker">${completionHistory('habits')}<div class="rt-items ${displayMode==='grid'?'rt-grid':''}">${due.map(h=>{const r=habitResult(h.id),plan=days[date]?.find(b=>b.habitId===h.id);return `<div class="rt-row rt-${r.status}" data-habitrow="${h.id}" aria-label="${esc(h.name)}, ${r.status==='none'?'unrecorded':r.status}">${swipeUnderlay()}<div class="rt-cardfront"><button type="button" class="rt-rowbody" data-habitmenu="${h.id}"><span class="rt-title">${esc(h.name)}</span>${h.description?`<span class="rt-target">${esc(h.description)}</span>`:''}${h.type==='value'?`<span class="rt-target">At least ${h.target} ${esc(h.unit)}</span>`:''}${plan?`<span class="bp2-linked">${ico(plan.scheduleId?'repeat':'link')}${fmt(plan.start)}</span>`:''}</button><button type="button" class="rt-value" data-habitvalue="${h.id}" aria-label="${h.type==='value'?'Set result for':'Toggle result for'} ${esc(h.name)}">${h.type==='value'?(r.value||0):ico(r.status==='missed'?'x':r.status==='skip'?'minus':'check')}</button></div></div>`}).join('')}</div><button type="button" class="rt-add" data-addhabit>${ico('plus')}Add habit</button></section>`;mountHistory();icons()}
function habitMenu(){const h=currentHabit(),r=habitResult(h.id);showDialog(h.name,`<div class="rt-statusactions">${btn('Done','data-status="done"')}${btn('Not done','data-status="missed"')}${btn('Clear','data-status="none"')}</div>${option('Schedule habit','calendar-plus','data-schedulehabit')}${schedules.filter(r=>r.habitId===h.id).map(r=>option(esc(scheduleLabel(r)),'repeat',`data-editschedule="${r.id}"`)).join('')}${option('Edit habit','pencil','data-habitsettings')}${option('View stats','chart-no-axes-column','data-habitstats')}${option(r.status==='skip'?'Unskip':'Skip','minus-square',`data-status="${r.status==='skip'?'none':'skip'}"`)}`,'rt-dialog')}
function habitValue(){const h=currentHabit(),r=habitResult(h.id);showDialog(h.name,`<div class="rt-settingsrow" style="margin-bottom:20px"><span>${ico('target')} At least ${h.target} ${esc(h.unit)}</span></div>${field(h.unit,`<input id="rt-result" type="number" min="0" step="0.1" value="${r.value||0}">`)}${btn('Submit','data-submitresult','bp2-primary bp2-full')}`,'rt-dialog')}
function habitSettings(){const h=currentHabit();showDialog(h.name,`<label class="rt-active">${h.active?'Active':'Inactive'}<input type="checkbox" data-hactive ${h.active?'checked':''}></label>${option('Schedule habit','calendar-plus','data-schedulehabit')}${schedules.filter(r=>r.habitId===h.id).map(r=>option(esc(scheduleLabel(r)),'repeat',`data-editschedule="${r.id}"`)).join('')}<div class="rt-subhead">When to track</div><div class="rt-settingsrow"><span>Repeat</span><span>${h.week.length===7?'Every day':'Selected days'}</span></div><div class="rt-week">${['M','T','W','T','F','S','S'].map((d,i)=>`<button type="button" aria-label="${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}" data-hweekday="${i}" aria-pressed="${h.week.includes(i)}">${d}</button>`).join('')}</div>${field('Reminder',`<input type="time" value="${h.reminder}" data-hreminder>`)}<div class="rt-subhead">How to track</div><label class="rt-settingsrow"><span>Use real numbers</span><input type="checkbox" data-hnumeric ${h.type==='value'?'checked':''}></label>${h.type==='value'?`<div class="bp2-fields" style="margin-top:15px">${field('Unit',`<select data-hunit>${['minutes','pages','litres','km','times'].map(u=>`<option ${u===h.unit?'selected':''}>${u}</option>`).join('')}</select>`)}${field('At least',`<input type="number" data-htarget min="0" step="0.1" value="${h.target}">`)}</div>`:''}<div class="bp2-actionrow">${btn('Rename','data-hrename')}${btn('Done','data-hdone','bp2-primary')}</div>`,'rt-dialog')}
function habitStats(){const h=currentHabit(),entries=Object.entries(habitResults).filter(([,v])=>v[h.id]?.status==='done');showDialog(h.name,`<div class="bp2-stat">${entries.length} <small>days completed</small></div>${Object.keys(habitResults).sort().reverse().slice(0,7).map(d=>`<div class="rt-settingsrow"><span>${dateLabel(d)}</span><span>${habitResults[d][h.id]?.status==='done'?ico('check'):habitResults[d][h.id]?.status==='missed'?ico('x'):'—'}</span></div>`).join('')}`,'rt-dialog')}
function manageHabits(){showDialog('Habits',`${habits.map(h=>option(esc(h.name),'pencil',`data-managehabit="${h.id}"`)).join('')}${option('Add habit','plus','data-addhabit')}`,'rt-dialog')}
function history(cat='German',period='3'){const values=({German:[8.5,10,12.5],Work:[70,80,68],Movement:[12,15,18],Personal:[22,24,21],Reading:[8,12,14],Family:[4,5,6]})[cat]||[0,0,0],vs=period==='1'?values.slice(-1):values,months=period==='1'?['September']:['July','August','September'];main.innerHTML=section('History')+`<div class="bp2-fields"><label class="bp2-field">Category<select data-hcat>${categories.map(c=>`<option ${c.name===cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="bp2-field">Period<select data-hperiod><option value="3" ${period==='3'?'selected':''}>July–September 2026</option><option value="1" ${period==='1'?'selected':''}>September 2026</option></select></label></div><div class="bp2-stat">${vs.reduce((a,b)=>a+b,0)} <small>hours completed</small></div><div class="bp2-chart" role="img" aria-label="${esc(cat)}: ${months.map((m,i)=>m+' '+vs[i]+' hours').join(', ')}">${vs.map(v=>`<div class="bp2-month"><span>${v}h</span><div class="bp2-bar" style="background:${color(cat)};height:${Math.max(4,v/Math.max(...vs,1)*210)}px"></div></div>`).join('')}</div><div class="bp2-monthlabels">${months.map(m=>`<span>${m}</span>`).join('')}</div></section>`}
function render(){head();app.classList.toggle('bp2-mobile',layout==='mobile');overlay.hidden=true;overlay.innerHTML='';main.style.minHeight='';if(page==='schedule')schedule();else if(page==='backlog')backlogView();else if(page==='categories')categoriesView();else if(page==='tracker')tracker();else history();icons()}
function showDialog(title,body,extra=''){menu=false;head();overlay.innerHTML=`<section class="bp2-dialog ${extra}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="bp2-dialoghead"><h2>${esc(title)}</h2>${iconBtn('x','Close','data-close')}</div>${body}</section>`;overlay.style.top=header.offsetHeight+'px';overlay.hidden=false;icons();const d=overlay.firstElementChild;main.style.minHeight=Math.max(624,d.offsetHeight+50)+'px'}
function closeDialog(){overlay.hidden=true;overlay.innerHTML='';main.style.minHeight='';returnDialog=null;icons()}
const field=(label,html)=>`<label class="bp2-field">${label}${html}</label>`;
const option=(name,icon,attrs)=>`<button type="button" class="bp2-option" ${attrs}>${ico(icon)}<span>${name}</span><span class="bp2-chevron">${ico('chevron-right')}</span></button>`;
function detail(){const b=getBlock();if(!b)return;const checked=blockStatus(b)==='done'?'checked':'';showDialog(b.name,`<div class="bp2-chiprow">${b.cats.map(c=>`<button type="button" class="bp2-chip" style="background:${color(c)}" data-editcats>${esc(c)}</button>`).join('')}<button type="button" class="bp2-chip bp2-chipnew" data-editcats>+</button></div><div class="bp2-fields bp2-timing">${field('Start',`<input type="time" id="bp2-detailtime" value="${fmt(b.start)}" step="900" data-start>`)}<div class="bp2-field"><span>Duration</span><div class="bp2-stepper"><button type="button" data-duration="-15" aria-label="Shorten fifteen minutes">−</button><output>${dur(b.dur)}</output><button type="button" data-duration="15" aria-label="Extend fifteen minutes">+</button></div></div></div><div class="bp2-actionrow">${btn(ico('arrow-right')+' Move to tomorrow','data-move="tomorrow"')}${btn(ico('list-plus')+' Backlog','data-move="backlog"')}</div>${b.tasks?b.tasks.map((t,i)=>`<label class="bp2-check"><input type="checkbox" data-task="${i}" ${b.completedTasks?.includes(i)?'checked':''}>${esc(t)}</label>`).join(''):''}${option(b.habitId?'Habit: '+esc(habitById(b.habitId)?.name||'Habit'):'Link habit','link','data-linkhabit')}${b.scheduleId?option('Repeat settings','repeat',`data-editschedule="${b.scheduleId}"`):''}${option('Move within day','move','data-moveblock')}${option('Add another thing','plus','data-addtask')}<details class="bp2-settings"><summary>More settings</summary>${field('Date',`<input type="date" value="${date}" data-blockdate>`)}<div class="bp2-actionrow">${btn('Earlier','data-order="-1"')}${btn('Later','data-order="1"')}${btn('Rename','data-rename')}</div></details><div class="rt-statusactions">${[ ['done','Done'],['missed','Not done'],['none','Clear'] ].map(([status,label])=>btn(label,`data-blockstatus="${status}" aria-pressed="${blockStatus(b)===status}"`)).join('')}</div>`)}
let form={name:'German conversation',start:540,dur:60,cats:['German']};
function readAdd(){if(!root.querySelector('#bp2-addname'))return;form.name=root.querySelector('#bp2-addname').value;form.start=mins(root.querySelector('#bp2-addtime').value);form.dur=Number(root.querySelector('#bp2-addduration').value)}
function add(){showDialog('Add block',`${field('Name',`<input id="bp2-addname" value="${esc(form.name)}" placeholder="Name">`)}<div class="bp2-fields">${field('Start',`<input id="bp2-addtime" type="time" step="900" value="${fmt(form.start)}">`)}${field('Duration',`<select id="bp2-addduration">${[15,30,45,60,90,120,150,180,240].map(n=>`<option value="${n}" ${n===form.dur?'selected':''}>${dur(n)}</option>`).join('')}</select>`)}</div><div class="bp2-field">Categories</div><div class="bp2-chiprow">${categories.map(c=>`<button type="button" class="bp2-chip" style="background:${color(c.name)}" data-formcat="${esc(c.name)}" aria-pressed="${form.cats.includes(c.name)}">${esc(c.name)}</button>`).join('')}<button type="button" class="bp2-chip bp2-chipnew" data-newcat>+ New</button></div><p class="bp2-error" id="bp2-adderror" role="alert" hidden></p>${btn('Add','data-saveadd','bp2-primary bp2-full')}`)}
function valid(start,duration){return Number.isFinite(start)&&start>=480&&start%15===0&&duration>=15&&start+duration<=1440}
function hitlist(d){return list().filter(b=>b.id!==d.id&&b.start<d.start+d.dur&&b.start+b.dur>d.start)}
function conflicts(){const hits=hitlist(pending);showDialog('Overlap',`<div class="bp2-pair"><div class="bp2-conflictitem" style="background:${fill(pending.cats)}"><span>${esc(pending.name)}</span><small>${fmt(pending.start)}–${fmt(pending.start+pending.dur)}</small></div>${hits.map(b=>`<div class="bp2-conflictitem" style="background:${fill(b.cats)}"><span>${esc(b.name)}</span><small>${fmt(b.start)}–${fmt(b.start+b.dur)}</small></div>`).join('')}</div>${option('Push following blocks','arrow-right','data-resolve="push"')}${option('Next available time','scan-line','data-resolve="free"')}${option('Merge','combine','data-resolve="merge"')}${option('Edit this block','pencil','data-resolve="edit"')}${option('Add to backlog','list-plus','data-resolve="backlog"')}`)}
function nextSpace(items,start,duration){let t=start;for(const b of [...items].sort((a,b)=>a.start-b.start)){if(b.start>=t+duration)break;if(b.start+b.dur>t&&b.start<t+duration)t=b.start+b.dur}return t}
function resolve(mode){const d={...pending,id:pending.id||++nextId},original=list().map(b=>({...b})),other=list().filter(b=>b.id!==d.id);if(mode==='edit'){form={...d};add();return}if(mode==='backlog'){backlog.push({...d,date:''});if(pending.id)days[date]=other;render();notify('Added to backlog');return}if(mode==='free'){d.start=nextSpace(other,d.start,d.dur);if(d.start+d.dur>1440)return notify('No space before midnight');days[date]=[...other,d]}if(mode==='push'){let t=d.start+d.dur;const shifted=[];for(const b of other){if(b.start+b.dur<=d.start){shifted.push(b);continue}if(b.start<d.start){const left=d.start-b.start,right=b.dur-left;shifted.push({...b,dur:left});shifted.push({...b,id:++nextId,start:t,dur:right});t+=right;continue}const start=Math.max(t,b.start);shifted.push({...b,start});t=start+b.dur}if(shifted.some(b=>b.start+b.dur>1440)){days[date]=original;return notify('Would extend past midnight')}days[date]=[...shifted,d]}if(mode==='merge'){const hits=other.filter(b=>b.start<d.start+d.dur&&b.start+b.dur>d.start);const start=Math.min(d.start,...hits.map(b=>b.start)),end=Math.max(d.start+d.dur,...hits.map(b=>b.start+b.dur));days[date]=other.filter(b=>!hits.includes(b));const tasks=[...hits.flatMap(b=>b.tasks||[b.name]),...(d.tasks||[d.name])];days[date].push({...d,name:tasks.join(' + '),tasks,start,dur:end-start,cats:[...new Set([...hits.flatMap(b=>b.cats),...d.cats])]})}pending=null;render()}
function changeDuration(id,delta){const items=list(),i=items.findIndex(b=>b.id===id);if(i<0)return;const b=items[i],length=Math.max(15,Math.min(240,b.dur+delta)),diff=length-b.dur;if(items.at(-1).start+items.at(-1).dur+diff>1440)return notify('Would extend past midnight');b.dur=length;for(let j=i+1;j<items.length;j++)items[j].start+=diff;render()}
function moveBlock(targetDate){const b=getBlock();if(!b)return;const originalDate=date;days[originalDate]=list().filter(x=>x.id!==b.id);if(!days[targetDate])days[targetDate]=[];b.start=nextSpace(days[targetDate],b.start,b.dur);if(b.start+b.dur>1440){days[originalDate].push(b);return notify('No space on that date')}days[targetDate].push(b);render();notify(`Moved to ${dateLabel(targetDate)}`)}
function navigate(target){date=target;historyFocus=date;menu=false;render()}
function calendar(){const [y,m]=calMonth.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)),count=new Date(Date.UTC(y,m,0)).getUTCDate(),offset=(first.getUTCDay()+6)%7;showDialog('Date',`<div class="bp2-calhead">${iconBtn('chevron-left','Previous month','data-month="-1"')}<span>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'})}</span>${iconBtn('chevron-right','Next month','data-month="1"')}</div><div class="bp2-weekdays">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}</div><div class="bp2-dates">${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:count},(_,i)=>{const iso=calMonth+'-'+String(i+1).padStart(2,'0');return `<button type="button" data-date="${iso}" aria-pressed="${iso===date}" aria-label="${dateLabel(iso)}">${i+1}</button>`}).join('')}</div><div class="bp2-calactions">${btn('Today',`data-date="${today}"`)}${btn('Close','data-close')}</div>`,'bp2-calendar')}
function newCategory(){readAdd();returnDialog=overlay.querySelector('#bp2-addname')?'add':overlay.querySelector('[data-editcats]')?'detail':null;showDialog('New category',`${field('Name','<input id="bp2-catname" placeholder="Name">')}${field('Colour','<select id="bp2-catcolor"><option value="purple">Purple</option><option value="lime">Lime</option><option value="orange">Orange</option><option value="blue">Blue</option><option value="pink">Pink</option><option value="yellow">Yellow</option></select>')}${btn('Create','data-savecat','bp2-primary bp2-full')}`)}
function editCats(){const b=getBlock();showDialog('Categories',`${categories.map(c=>`<label class="bp2-check"><input type="checkbox" data-blockcat="${esc(c.name)}" ${b.cats.includes(c.name)?'checked':''}><span class="bp2-dot" style="background:${color(c.name)}"></span>${esc(c.name)}</label>`).join('')}<div class="bp2-actionrow">${btn('+ New','data-newcat')}${btn('Done','data-detail','bp2-primary')}</div>`)}
function describe(){showDialog('Describe a day',`${field('Schedule','<textarea id="bp2-description">German at 8:30 for an hour, then project work until noon. Lunch at noon. Walk with a German podcast at 3.</textarea>')}<p class="bp2-muted">Example preview</p><div class="bp2-pair" style="margin-top:12px"><div class="bp2-conflictitem" style="background:var(--b-purple)"><span>German</span><small>08:30 · 1h</small></div><div class="bp2-conflictitem" style="background:var(--b-blue)"><span>Project work</span><small>09:30 · 2h 30m</small></div><div class="bp2-conflictitem" style="background:var(--b-orange)"><span>Lunch</span><small>12:00 · 1h</small></div><div class="bp2-conflictitem" style="background:${fill(['Movement','German'])}"><span>Walk + German podcast</span><small>15:00 · 1h</small></div></div>${btn('Close','data-close','bp2-full')}`)}
function setScene(i){scene=i;root.querySelector('#bp2-scenes').value=i;page=i===1||i===3||i===10?'tracker':i===7?'backlog':i===8?'categories':i===9?'history':'schedule';layout=i===2?'mobile':'grid';render();if(i===3){selectedHabit=1;habitSettings();}if(i===10){selectedHabit=4;openHabitSchedule();}if(i===4)add();if(i===5){pending={name:'German conversation',start:540,dur:60,cats:['German']};conflicts()}if(i===6){selected=list().find(b=>b.id===7)?.id||list()[0]?.id;detail()}}
root.querySelector('#bp2-scenes').innerHTML=scenes.map((n,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${n}</option>`).join('');
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b||!root.contains(b)||swipeBusy)return;if(suppressClick&&(b.hasAttribute('data-open')||b.hasAttribute('data-reorder')))return;if(historySwipeClick&&b.hasAttribute('data-date'))return;

 if(b.hasAttribute('data-hweekday')){const h=currentHabit(),i=Number(b.dataset.hweekday);h.week=h.week.includes(i)?h.week.filter(x=>x!==i):[...h.week,i];tracker();habitSettings();return}
 if(b.hasAttribute('data-hdone')){render();return}
 if(b.hasAttribute('data-hrename')){showDialog('Rename',`${field('Name',`<input id="rt-rename" value="${esc(currentHabit().name)}">`)}${btn('Save','data-hsaverename','bp2-primary bp2-full')}`,'rt-dialog');return}

 if(b.hasAttribute('data-hsave')){const name=root.querySelector('#rt-newname').value.trim(),type=root.querySelector('#rt-newtype').value;if(!name)return notify('Enter a name');const h={id:habits.length+1,name,description:'',type,unit:'minutes',target:30,week:[0,1,2,3,4,5,6],active:true,reminder:''};habits.push(h);selectedHabit=h.id;tracker();habitSettings();return}

 if(b.hasAttribute('data-tracker')){page='tracker';menu=false;render();return}
 if(b.hasAttribute('data-menu')){menu=!menu;head();icons();return}
 if(b.hasAttribute('data-day')){navigate(shiftDate(date,Number(b.dataset.day)));return}
 if(b.hasAttribute('data-date')){navigate(b.dataset.date);return}
 if(b.hasAttribute('data-calendar')){calMonth=date.slice(0,7);calendar();return}
 if(b.hasAttribute('data-month')){const d=new Date(calMonth+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+Number(b.dataset.month));calMonth=d.toISOString().slice(0,7);calendar();return}
 if(b.hasAttribute('data-close')){closeDialog();return}
 if(b.hasAttribute('data-open')){selected=Number(b.dataset.open);detail();return}
 if(b.hasAttribute('data-detail')){detail();return}
 if(b.hasAttribute('data-add')||b.hasAttribute('data-add-at')){pending=null;form={name:'',start:b.hasAttribute('data-add-at')?Number(b.dataset.addAt):540,dur:60,cats:[]};add();return}
 if(b.hasAttribute('data-describe')){describe();return}
 if(b.hasAttribute('data-duration')){changeDuration(selected,Number(b.dataset.duration));detail();return}
 if(b.dataset.move==='tomorrow'){moveBlock(shiftDate(date,1));return}
 if(b.dataset.move==='backlog'){const item=getBlock();backlog.unshift({...item,date:''});days[date]=list().filter(x=>x.id!==item.id);render();notify('Added to backlog');return}
 if(b.hasAttribute('data-formcat')){readAdd();const c=b.dataset.formcat;form.cats=form.cats.includes(c)?form.cats.filter(x=>x!==c):[...form.cats,c];add();return}
 if(b.hasAttribute('data-editcats')){editCats();return}
 if(b.hasAttribute('data-newcat')){newCategory();return}
 if(b.hasAttribute('data-savecat')){const name=root.querySelector('#bp2-catname').value.trim(),col=root.querySelector('#bp2-catcolor').value;if(!name)return notify('Enter a name');if(categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return notify('Category exists');categories.push({name,color:col,hex:categories.find(c=>c.color===col)?.hex||'#b48aff'});if(returnDialog==='add'){form.cats.push(name);add()}else if(returnDialog==='detail'){getBlock().cats.push(name);detail()}else render();return}
 if(b.hasAttribute('data-saveadd')){readAdd();const error=root.querySelector('#bp2-adderror');if(!form.name.trim()||!valid(form.start,form.dur)){error.hidden=false;error.textContent=!form.name.trim()?'Enter a name.':'Use a 15-minute start time between 08:00 and midnight.';return}pending={...form,id:pending?.id};if(hitlist(pending).length)conflicts();else{days[date]=list().filter(x=>x.id!==pending.id);days[date].push({...pending,id:pending.id||++nextId});pending=null;render()}return}
 if(b.hasAttribute('data-resolve')){resolve(b.dataset.resolve);return}
 if(b.hasAttribute('data-addtask')){showDialog('Add another thing',`${field('Name','<input id="bp2-taskname" placeholder="Name">')}${btn('Add','data-savetask','bp2-primary bp2-full')}`);return}
 if(b.hasAttribute('data-savetask')){const n=root.querySelector('#bp2-taskname').value.trim();if(!n)return notify('Enter a name');const item=getBlock();item.tasks=[...(item.tasks||[item.name]),n];item.name=item.tasks.join(' + ');render();detail();return}
 if(b.hasAttribute('data-order')){const a=list(),i=a.findIndex(x=>x.id===selected),j=i+Number(b.dataset.order);if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];let start=480;for(const x of a){x.start=start;start+=x.dur}}render();detail();return}
 if(b.hasAttribute('data-rename')){showDialog('Rename',`${field('Name',`<input id="bp2-rename" value="${esc(getBlock().name)}">`)}${btn('Save','data-saverename','bp2-primary bp2-full')}`);return}
 if(b.hasAttribute('data-saverename')){const n=root.querySelector('#bp2-rename').value.trim();if(n){getBlock().name=n;render();detail()}return}
 if(b.hasAttribute('data-backorder')){const i=Number(b.dataset.backorder),j=i+Number(b.dataset.dir);if(j>=0&&j<backlog.length)[backlog[i],backlog[j]]=[backlog[j],backlog[i]];render();return}
 if(b.hasAttribute('data-backtoday')){const i=backlog.findIndex(x=>x.id===Number(b.dataset.backtoday)),item=backlog[i],target=days[today];const start=nextSpace(target,480,item.dur);if(start+item.dur>1440)return notify('No space today');target.push({...item,id:++nextId,start});backlog.splice(i,1);render();notify('Added to today');return}
 if(b.hasAttribute('data-backdate')){const item=backlog.find(x=>x.id===Number(b.dataset.backdate));showDialog('Schedule item',`${field('Date',`<input type="date" id="bp2-backdate" value="${item.date}">`)}${btn('Save',`data-savebackdate="${item.id}"`,'bp2-primary bp2-full')}`);return}
 if(b.hasAttribute('data-savebackdate')){backlog.find(x=>x.id===Number(b.dataset.savebackdate)).date=root.querySelector('#bp2-backdate').value;render();return}
 if(b.hasAttribute('data-backadd')){showDialog('Add to backlog',`${field('Name','<input id="bp2-backname">')}${field('Duration','<select id="bp2-backduration"><option value="30">30m</option><option value="60">1h</option><option value="90">1h 30m</option></select>')}${btn('Add','data-saveback','bp2-primary bp2-full')}`);return}
 if(b.hasAttribute('data-saveback')){const n=root.querySelector('#bp2-backname').value.trim();if(!n)return notify('Enter a name');backlog.push({id:++nextId,name:n,dur:Number(root.querySelector('#bp2-backduration').value),cats:[],date:''});render();return}
});
root.addEventListener('change',e=>{const el=e.target;if(el.id==='bp2-scenes'){setScene(Number(el.value));return}if(el.hasAttribute('data-auto'))autoBacklog=el.checked;if(el.hasAttribute('data-blockcat')){const b=getBlock(),c=el.dataset.blockcat;b.cats=el.checked?[...new Set([...b.cats,c])]:b.cats.filter(x=>x!==c);schedule()}if(el.hasAttribute('data-complete')){setBlockStatus(getBlock(),el.checked?'done':'none');schedule()}if(el.hasAttribute('data-task')){const b=getBlock(),i=Number(el.dataset.task);b.completedTasks=el.checked?[...new Set([...(b.completedTasks||[]),i])]:(b.completedTasks||[]).filter(x=>x!==i)}if(el.hasAttribute('data-start')){const item=getBlock(),start=mins(el.value);if(!valid(start,item.dur)){el.value=fmt(item.start);return notify('Use a 15-minute start time')}pending={...item,start};if(hitlist(pending).length)conflicts();else{item.start=start;render();detail()}}if(el.hasAttribute('data-blockdate')&&el.value&&el.value!==date)moveBlock(el.value);if(el.hasAttribute('data-color')){const c=categories[Number(el.dataset.color)];c.hex=el.value;root.style.setProperty('--b-'+c.color,`light-dark(${c.hex},${c.hex})`)}if(el.hasAttribute('data-hcat')||el.hasAttribute('data-hperiod'))history(root.querySelector('[data-hcat]').value,root.querySelector('[data-hperiod]').value)});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();menu=false;head();icons()}const edge=e.target.closest('[data-resize]');if(edge&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();changeDuration(Number(edge.dataset.resize),['ArrowRight','ArrowUp'].includes(e.key)?15:-15)}});
root.addEventListener('change',e=>{const el=e.target;if(el.hasAttribute('data-hactive')){currentHabit().active=el.checked;tracker();habitSettings()}if(el.hasAttribute('data-hnumeric')){currentHabit().type=el.checked?'value':'binary';tracker();habitSettings()}if(el.hasAttribute('data-hreminder'))currentHabit().reminder=el.value;if(el.hasAttribute('data-hunit')){currentHabit().unit=el.value;tracker()}if(el.hasAttribute('data-htarget')){const value=Number(el.value);if(Number.isFinite(value)&&value>=0){currentHabit().target=value;tracker()}}});
root.addEventListener('change',e=>{if(e.target.id==='bp2-schedule-repeat'){readSchedule();habitSchedule()}});
let narrow=root.clientWidth<560;new ResizeObserver(()=>{const next=root.clientWidth<560;if(next!==narrow){narrow=next;if(page==='schedule'&&overlay.hidden){schedule();icons()}}}).observe(root);
render();
if(globalThis.Tweak){const look={radius:17,gap:3};const tweak=new Tweak({container:app,onChange:()=>{root.style.setProperty('--b-radius',look.radius+'px');root.style.setProperty('--b-gap',look.gap+'px')}});tweak.addSlider(look,'radius',{label:'Block corners',min:8,max:26,unit:'px'});tweak.addSlider(look,'gap',{label:'Block seams',min:0,max:6,unit:'px'})}
})();
</script>
