name: Check application
on:
  pull_request:
  push:
    branches: [main, production]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: yarn.lock
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - run: yarn synth
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-assembly
          path: cdk.out/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
