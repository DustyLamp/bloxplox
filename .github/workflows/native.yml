name: Build native previews (no deployment)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native preview to build
        type: choice
        default: both
        options: [both, android, ios]
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    if: github.event.repository.private == false && inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck:mobile
      - run: yarn workspace @bloxplox/mobile prebuild --platform android --no-install
      - name: Build bundled Android preview
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk-development-signing
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 1
  ios:
    if: github.event.repository.private == false && inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @bloxplox/mobile prebuild --platform ios --no-install
      - name: Install iOS dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build iOS simulator application
        # Xcode's local simulator signature embeds the application identity
        # required by Keychain. Disabling signing also disables that entitlement.
        run: xcodebuild -workspace apps/mobile/ios/BloxPlox.xcworkspace -scheme BloxPlox -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios -quiet
      - name: Package simulator application
        run: tar -czf BloxPlox-ios-simulator.tar.gz -C build-ios/Build/Products/Release-iphonesimulator BloxPlox.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: BloxPlox-ios-simulator.tar.gz
          retention-days: 1
